<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Management</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="sidebar">

        <h2>Real3st BI</h2>

        <a href="/dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
        <a href="/student.html"><i class="fa-solid fa-user-graduate"></i><span>Students</span></a>
        <a href="/courses.html"><i class="fa-solid fa-book-open"></i><span>Courses</span></a>
        <a href="/membership.html"><i class="fa-solid fa-id-card"></i><span>Memberships</span></a>
        <a href="/payments.html"><i class="fa-solid fa-credit-card"></i><span>Payments</span></a>
        <a href="/certificate.html"><i class="fa-solid fa-award"></i><span>Certificates</span></a>
        <a href="/qualification.html"><i class="fa-solid fa-certificate"></i><span>Qualifications</span></a>
        <a href="/reports.html"><i class="fa-solid fa-chart-column"></i><span>Reports</span></a>
        <a href="/user.html"><i class="fa-solid fa-users-gear"></i><span>User Management</span></a>

        <button onclick="logout()">Logout</button>

    </div>

    <div class="main-content">

        <div class="header">
            <h1>Certificate Management</h1>
        </div>

        <div class="form-container">

            <input type="hidden" id="certificateId">

            <input type="number" id="studentId" placeholder="Student ID">

            <input type="number" id="courseId" placeholder="Course ID">

            <input type="text" id="certificateNumber" placeholder="Certificate Number">

            <label>
                Issue Date
                <input type="date" id="issueDate">
            </label>

            <label>
                Expiry Date
                <input type="date" id="expiryDate">
            </label>

            <button type="button" onclick="saveCertificate()">
                Save Certificate
            </button>

            <button type="button" onclick="clearCertificateForm()">
                Clear
            </button>

            <button type="button" onclick="loadCertificates()">
                Refresh
            </button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student ID</th>
                    <th>Course ID</th>
                    <th>Certificate Number</th>
                    <th>Issue Date</th>
                    <th>Expiry Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="certificatesBody"></tbody>

        </table>

    </div>

    <script src="certificate.js"></script>

</body>

</html>
