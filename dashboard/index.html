<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL3ST BI Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <h1>REAL3ST BI Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h2>Students</h2>
            <p id="students">0</p>
        </div>

        <div class="card">
            <h2>Instructors</h2>
            <p id="instructors">0</p>
        </div>

        <div class="card">
            <h2>Courses</h2>
            <p id="courses">0</p>
        </div>

        <div class="card">
            <h2>Memberships</h2>
            <p id="memberships">0</p>
        </div>

        <div class="card">
            <h2>Certificates</h2>
            <p id="certificates">0</p>
        </div>

        <div class="card">
            <h2>Firearms Qualifications</h2>
            <p id="qualifications">0</p>
        </div>
    </div>

    <div style="text-align:center;margin:20px 0;">
        <a href="/membership.html">Membership Management</a>
    </div>

    <h2>Academy Statistics</h2>

    <div style="width:700px;margin:auto;">
        <canvas id="academyChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
