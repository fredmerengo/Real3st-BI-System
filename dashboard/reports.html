<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports Center</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <h2>Real3st BI</h2>

        <a href="../dashboard/dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
        <a href="../students/student.html"><i class="fa-solid fa-user-graduate"></i><span>Students</span></a>
        <a href="../courses/courses.html"><i class="fa-solid fa-book-open"></i><span>Courses</span></a>
        <a href="../memberships/membership.html"><i class="fa-solid fa-id-card"></i><span>Memberships</span></a>
        <a href="../payments/payments.html"><i class="fa-solid fa-credit-card"></i><span>Payments</span></a>
        <a href="../certificates/certificates.html"><i class="fa-solid fa-award"></i><span>Certificates</span></a>
        <a href="../qualifications/qualifications.html"><i class="fa-solid fa-certificate"></i><span>Qualifications</span></a>
        <a href="../reports/reports.html"><i class="fa-solid fa-chart-column"></i><span>Reports</span></a>
        <a href="../users/user.html"><i class="fa-solid fa-users-gear"></i><span>User Management</span></a>

        <button onclick="logout()">
            Logout
        </button>

    </div>


    <!-- ================= MAIN ================= -->

    <main class="main-content">

        <div class="header">
            <h1>Reports Center</h1>
        </div>


        <!-- ================= CONTROLS ================= -->

        <div class="form-container">

            <select id="reportType">

                <option value="students">
                    Student Report
                </option>

                <option value="courses">
                    Course Report
                </option>

                <option value="memberships">
                    Membership Report
                </option>

                <option value="payments">
                    Payment Report
                </option>

                <option value="certificates">
                    Certificate Report
                </option>

                <option value="qualifications">
                    Qualification Report
                </option>

            </select>


            <input type="text" id="reportSearch" placeholder="Search current report...">


            <button onclick="generateReport()">
                Generate Report
            </button>


            <button onclick="exportExcel()" style="background:#15803d;">
                Export Excel
            </button>


            <button onclick="printReport()" style="background:#374151;">
                Print / PDF
            </button>


            <button onclick="refreshReport()">
                Refresh
            </button>

        </div>


        <!-- ================= STATUS MESSAGE ================= -->

        <div id="statusMessage" class="status-message"></div>


        <!-- ================= REPORT SUMMARY ================= -->

        <section class="stats-container">

            <div class="card">

                <h3>
                    Current Records
                </h3>

                <p id="recordCount">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Total Revenue
                </h3>

                <p id="totalRevenue">
                    $0.00
                </p>

            </div>


            <div class="card">

                <h3>
                    Report Generated
                </h3>

                <p id="generatedDate" style="font-size:22px;">
                    —
                </p>

            </div>

        </section>


        <!-- ================= REPORT TABLE ================= -->

        <section>

            <h2 id="reportTitle">
                Student Report
            </h2>


            <div class="table-container">

                <table id="reportTable">

                    <thead id="reportTableHead">

                        <tr>

                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>

                        </tr>

                    </thead>


                    <tbody id="reportTableBody">

                        <tr>

                            <td colspan="10">
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Excel Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- Reports JavaScript -->
    <script src="./report.js"></script>

</body>

</html>
