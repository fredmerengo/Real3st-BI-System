<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firearms Qualifications</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="sidebar">

        <h2>Real3st BI</h2>

        <a href="/dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
        <a href="/student.html"><i class="fa-solid fa-user-graduate"></i><span>Students</span></a>
        <a href="/courses.html"><i class="fa-solid fa-book-open"></i><span>Courses</span></a>
        <a href="/membership.html"><i class="fa-solid fa-id-card"></i><span>Memberships</span></a>
        <a href="/payments.html"><i class="fa-solid fa-credit-card"></i><span>Payments</span></a>
        <a href="/certificate.html"><i class="fa-solid fa-award"></i><span>Certificates</span></a>
        <a href="/qualification.html"><i class="fa-solid fa-certificate"></i><span>Qualifications</span></a>
        <a href="/reports.html"><i class="fa-solid fa-chart-column"></i><span>Reports</span></a>
        <a href="/user.html"><i class="fa-solid fa-users-gear"></i><span>User Management</span></a>

        <button type="button" onclick="logout()">
            Logout
        </button>

    </div>

    <div class="main-content">

        <div class="header">
            <h1>Firearms Qualifications</h1>
        </div>

        <div class="qualification-form">

            <input type="hidden" id="qualificationId">

            <input type="text" id="student_search" placeholder="Search students..." />
            <select id="student_id" required>
                <option value="">Select Student</option>
            </select>

            <input type="text" id="qualificationName" placeholder="Qualification Name">

            <select id="qualificationLevel">
                <option value="">Select Level</option>
                <option value="Basic">Basic</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
                <option value="Expert">Expert</option>
                <option value="Instructor">Instructor</option>
            </select>

            <label>
                Issue Date
                <input type="date" id="issueDate">
            </label>

            <select id="instructor">
                <option value="">Select Instructor</option>
            </select>

            <div class="qualification-buttons">

                <button type="button" onclick="saveQualification()">
                    Save Qualification
                </button>

                <button type="button" onclick="clearQualificationForm()">
                    Clear
                </button>

                <button type="button" onclick="loadQualifications()">
                    Refresh
                </button>

            </div>

        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Qualification</th>
                        <th>Level</th>
                        <th>Issue Date</th>
                        <th>Instructor</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="qualificationsBody"></tbody>

            </table>

        </div>

    </div>

    <script src="qualification.js"></script>

</body>

</html>
